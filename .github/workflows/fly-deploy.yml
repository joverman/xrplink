# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Fly deploy is MANUAL ONLY (workflow_dispatch) while self-hosting via Docker.
# To re-enable auto-deploy on push to main, change the deploy job's 'if' condition:
#   if: github.ref == 'refs/heads/main' && github.event_name == 'push'

name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Fly.io'
        required: true
        default: 'true'

jobs:
  test:
    name: Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --project tsconfig.ci.json

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: test
    # Manual deploy only (workflow_dispatch). Merging to main does NOT auto-deploy.
    # To re-enable auto-deploy: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: github.event_name == 'workflow_dispatch'
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
