# fly.toml app configuration file generated for xrp-link on 2026-07-19T17:20:18+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xrp-link'
primary_region = 'lhr'

[build]
[env]
  FLARE_NETWORK = 'flare'
  PORT = '3000'

[[mounts]]
  source = 'xrplink_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
