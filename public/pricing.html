<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — XRPLink</title>
<meta name="description" content="XRPLink plans: Free lookup, Paid and Pro subscriptions, and pay-as-you-go attestations on the XRP Ledger.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:#e2e8f0;background:#0f172a;line-height:1.6}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;max-width:1120px;margin:0 auto;gap:1rem;flex-wrap:wrap}
nav .logo{font-weight:700;font-size:1.25rem;color:#f1f5f9;text-decoration:none}
nav .logo span{color:#818cf8}
nav .nav-links{display:flex;gap:2rem;align-items:center}
nav .nav-links a,#authNav a{text-decoration:none;color:#94a3b8;font-size:0.9rem;font-weight:500}
nav .nav-links a:hover,#authNav a:hover{color:#e2e8f0}
#authNav{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-left:auto}
#authNav .auth-email{color:#94a3b8;font-size:0.8rem}
#authNav .btn{padding:0.45rem 1rem;font-size:0.8rem}
.btn{display:inline-block;padding:0.6rem 1.5rem;border-radius:8px;font-weight:600;font-size:0.9rem;text-decoration:none;cursor:pointer;border:none}
.btn-primary{background:#818cf8;color:#0f172a}
.btn-primary:hover{background:#6366f1}
.btn-outline{background:transparent;color:#818cf8;border:1.5px solid #818cf8}
.btn-outline:hover{background:#1e293b}
.section{padding:4rem 1.5rem}
.section h1{text-align:center;font-size:2rem;font-weight:700;margin-bottom:0.5rem;color:#f1f5f9}
.section .subtitle{text-align:center;color:#94a3b8;font-size:1.05rem;margin-bottom:3rem}
.pricing-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem;max-width:1120px;margin:0 auto}
.price-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2.5rem 2rem;text-align:center;position:relative;display:flex;flex-direction:column}
.price-card a.btn{margin-top:auto}
.price-card.featured{border-color:#818cf8;box-shadow:0 4px 24px rgba(99,102,241,0.15)}
.price-card.popular::before{content:"Most Popular";position:absolute;top:-0.6rem;left:50%;transform:translateX(-50%);background:#818cf8;color:#0f172a;font-size:0.7rem;font-weight:600;padding:0.2rem 1rem;border-radius:4px;text-transform:uppercase;letter-spacing:0.05em}
.price-card h3{font-size:1.1rem;margin-bottom:0.5rem;color:#f1f5f9}
.price-card .price{font-size:2.5rem;font-weight:800;color:#f1f5f9}
.price-card .price span{font-size:1rem;font-weight:400;color:#64748b}
.price-card .desc{color:#94a3b8;font-size:0.85rem;margin:0.5rem 0 1.5rem}
.price-card ul{list-style:none;text-align:left;margin-bottom:1.5rem}
.price-card ul li{padding:0.4rem 0;font-size:0.85rem;color:#cbd5e1}
.price-card ul li::before{content:"✓ ";color:#818cf8;font-weight:700}
footer{border-top:1px solid #1e293b;padding:3rem 1.5rem;text-align:center;color:#64748b;font-size:0.85rem}
footer a{color:#818cf8;text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:1024px){
  .pricing-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:720px}
}
@media(max-width:768px){
  .pricing-grid{grid-template-columns:1fr;max-width:400px}
  nav .nav-links a:not(:first-child){display:none}
}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">XRPL<span>ink</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/docs">API Docs</a>
    <a href="/pricing">Pricing</a>
    <a href="/contact">Contact</a>
  </div>
  <span id="authNav"></span>
</nav>

<section class="section" id="pricing">
  <h1>Pricing</h1>
  <p class="subtitle">Start with a free account, upgrade when you need verified receipts</p>
  {{PRICING_CARDS}}
</section>

<footer>
  <p><a href="/">XRPLink</a> — Cryptographically Verified XRP Payment Receipts</p>
  <p style="margin-top:0.5rem"><a href="/docs">API Docs</a> · <a href="/contact">Contact</a> · <a href="/signup">Sign Up</a> · <a href="/login">Log In</a></p>
</footer>

<script src="/session-nav.js" defer></script>

</body>
</html>
